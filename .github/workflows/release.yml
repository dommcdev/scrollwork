name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libglib2.0-bin
      - run: python3 scripts/package.py
      - run: gh release create "$GITHUB_REF_NAME" dist/*.shell-extension.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
